<nav class="navbar">
  <div class="navbar-container">
    <div class="nav-left">
      <a routerLink="/feed" class="brand-link">
        <h2>MindMemos</h2>
      </a>
    </div>

    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-center" [class.active]="isMenuOpen()">
      <ul class="navbar-nav">
        <li><a routerLink="/feed" routerLinkActive="active">Feed</a></li>
        <li><a routerLink="/search" routerLinkActive="active">Search</a></li>
        <li><a routerLink="/creative" routerLinkActive="active">Journaling</a></li>
        <li><a routerLink="/panic" routerLinkActive="active">Panic Mode</a></li>
      </ul>
    </div>

    <div class="nav-right" *ngIf="isAuthenticated">
      <a [routerLink]="['/users', currentUserId]" class="profile-block">
        <div class="profile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="username">{{ username }}</span>
      </a>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </div>
</nav>
