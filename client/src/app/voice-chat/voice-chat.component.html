<div class="voice-chat-container">
  <div class="voice-chat-card">
    <div class="voice-chat-header">
      <h2>Voice Chat</h2>
      <button 
        *ngIf="isInitialized" 
        class="btn-close" 
        (click)="disconnect()"
        aria-label="Disconnect">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
          <line x1="15" y1="5" x2="5" y2="15"></line>
          <line x1="5" y1="5" x2="15" y2="15"></line>
        </svg>
      </button>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Connection Status -->
    <div class="connection-status" [ngClass]="connectionStatus">
      <span class="status-indicator"></span>
      <span class="status-text">
        <span *ngIf="connectionStatus === 'disconnected'">Disconnected</span>
        <span *ngIf="connectionStatus === 'connecting'">Connecting...</span>
        <span *ngIf="connectionStatus === 'connected'">Connected{{ targetUserName ? ' to ' + targetUserName : '' }}</span>
      </span>
    </div>

    <!-- Initialization Form -->
    <div *ngIf="!isInitialized" class="init-form">
      <div class="form-group">
        <label for="targetUserId">User ID to connect with:</label>
        <input 
          id="targetUserId"
          type="text" 
          [(ngModel)]="targetUserId" 
          placeholder="Enter user ID"
          [disabled]="isConnecting"
          class="form-input">
      </div>
      <button 
        class="btn-primary" 
        (click)="initializeChat()"
        [disabled]="isConnecting || !targetUserId">
        <span *ngIf="!isConnecting">Connect</span>
        <span *ngIf="isConnecting">Connecting...</span>
      </button>
    </div>

    <!-- Voice Controls -->
    <div *ngIf="isInitialized" class="voice-controls">
      <!-- Recording Controls -->
      <div class="control-group">
        <button 
          class="btn-record" 
          [ngClass]="{ 'recording': state.isRecording }"
          (click)="state.isRecording ? stopRecording() : startRecording()"
          [disabled]="state.isPlaying">
          <svg *ngIf="!state.isRecording" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
          <svg *ngIf="state.isRecording" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          </svg>
          <span>{{ state.isRecording ? 'Stop' : 'Start' }} Recording</span>
        </button>

        <button 
          class="btn-mute" 
          [ngClass]="{ 'muted': state.isMuted }"
          (click)="toggleMute()"
          [disabled]="!state.isRecording">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
            <path *ngIf="!state.isMuted" d="M3 9v2a4 4 0 0 0 4 4h2l4 4V1L9 5H7a4 4 0 0 0-4 4z"></path>
            <path *ngIf="state.isMuted" d="M11 5L6 10H2v4h4l5 5V5zM15 7l4 4M19 7l-4 4"></path>
          </svg>
          <span>{{ state.isMuted ? 'Unmute' : 'Mute' }}</span>
        </button>
      </div>

      <!-- Status Indicators -->
      <div class="status-indicators">
        <div class="status-item" *ngIf="state.isRecording">
          <span class="pulse-dot"></span>
          <span>Recording...</span>
        </div>
        <div class="status-item" *ngIf="state.isPlaying">
          <span class="pulse-dot playing"></span>
          <span>Receiving audio...</span>
        </div>
      </div>

      <!-- Volume Control -->
      <div class="volume-control">
        <label>Volume:</label>
        <input 
          type="range" 
          min="0" 
          max="1" 
          step="0.1" 
          [value]="state.volume"
          (input)="setVolume($any($event.target).value)"
          class="volume-slider">
        <span class="volume-value">{{ (state.volume * 100).toFixed(0) }}%</span>
      </div>
    </div>
  </div>
</div>
