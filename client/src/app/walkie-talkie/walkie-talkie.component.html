<div class="walkie-talkie-container">
  <div class="header">
    <h1>Talk with user</h1>
    <p class="subtitle">User-to-user voice messaging</p>
  </div>

  <!-- Contact Selection -->
  <div class="contact-selection" *ngIf="!selectedContactId">
    <h2>Select a contact to talk to:</h2>
    <div class="contacts-list" *ngIf="contacts.length > 0">
      <button
        *ngFor="let contact of contacts"
        (click)="selectContact(contact.id)"
        class="contact-btn"
        type="button"
      >
        <span class="contact-name">{{ contact.username }}</span>
      </button>
    </div>
    <div *ngIf="contacts.length === 0" class="empty-contacts">
      <p>No contacts available. Add emergency contacts to use walkie-talkie.</p>
    </div>
  </div>

  <!-- Conversation View -->
  <div class="conversation-view" *ngIf="selectedContactId && selectedContact">
    <div class="conversation-header">
      <button (click)="selectedContactId = null; stopPolling(); messages = []; threadId = null" class="back-btn" type="button">
        ← Back
      </button>
      <h2>{{ selectedContact.username }}</h2>
    </div>

    <!-- Messages - Hidden, auto-play only (backend handles auto-play) -->
    <div class="messages-container" #messagesContainer style="display: none;">
      <!-- Messages are received and auto-played, but not displayed in UI -->
    </div>

    <!-- Recording Controls -->
    <div class="input-container">
      <div class="audio-controls">
        <button
          (click)="isRecording ? stopRecording() : startRecording()"
          [disabled]="isSending"
          class="mic-button"
          [class.recording]="isRecording"
          type="button"
          title="{{ isRecording ? 'Stop recording' : 'Start recording' }}"
        >
          <span *ngIf="!isRecording">🎤</span>
          <span *ngIf="isRecording">🔴</span>
        </button>
        <p class="mic-instruction">Click to start recording</p>
      </div>

      <div *ngIf="isSending" class="sending-status">
        <span>Sending message...</span>
      </div>
    </div>
  </div>
</div>
