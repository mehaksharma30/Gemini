<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Gateway Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 20px;
      line-height: 1.6;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    h1 {
      color: #4a9eff;
      margin-bottom: 20px;
    }
    
    .section {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .section h2 {
      color: #6bb6ff;
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      color: #b0b0b0;
      font-size: 14px;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 14px;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #4a9eff;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      font-weight: 500;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-primary {
      background: #4a9eff;
      color: white;
    }
    
    .btn-primary:hover:not(:disabled) {
      background: #3a8eef;
    }
    
    .btn-success {
      background: #4caf50;
      color: white;
    }
    
    .btn-success:hover:not(:disabled) {
      background: #45a049;
    }
    
    .btn-danger {
      background: #f44336;
      color: white;
    }
    
    .btn-danger:hover:not(:disabled) {
      background: #da190b;
    }
    
    .btn-warning {
      background: #ff9800;
      color: white;
    }
    
    .btn-warning:hover:not(:disabled) {
      background: #e68900;
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      background: #1a1a1a;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
    }
    
    .status-item {
      margin-bottom: 5px;
    }
    
    .status-label {
      color: #888;
      display: inline-block;
      width: 150px;
    }
    
    .status-value {
      color: #4a9eff;
    }
    
    .status-value.error {
      color: #f44336;
    }
    
    .status-value.success {
      color: #4caf50;
    }
    
    .log {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #888;
    }
    
    .log-entry {
      margin-bottom: 3px;
    }
    
    .log-entry.error {
      color: #f44336;
    }
    
    .log-entry.success {
      color: #4caf50;
    }
    
    .log-entry.info {
      color: #4a9eff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 Voice Gateway Test</h1>
    
    <div class="section">
      <h2>Connection</h2>
      <div class="form-group">
        <label for="callId">Call ID:</label>
        <input type="text" id="callId" value="test-call-1" placeholder="e.g., test-call-1">
      </div>
      <div class="form-group">
        <label for="userId">User ID:</label>
        <input type="text" id="userId" value="userA" placeholder="e.g., userA">
      </div>
      <div class="button-group">
        <button id="btnConnect" class="btn-primary">Connect</button>
        <button id="btnDisconnect" class="btn-danger" disabled>Disconnect</button>
      </div>
    </div>
    
    <div class="section">
      <h2>Audio Controls</h2>
      <div class="button-group">
        <button id="btnStartMic" class="btn-success" disabled>Start Mic</button>
        <button id="btnStopMic" class="btn-danger" disabled>Stop Mic</button>
        <button id="btnToggleMicMute" class="btn-warning" disabled>Mic: Unmuted</button>
        <button id="btnToggleSpeakerMute" class="btn-warning" disabled>Speaker: Unmuted</button>
      </div>
    </div>
    
    <div class="section">
      <h2>Status</h2>
      <div class="status">
        <div class="status-item">
          <span class="status-label">WebSocket:</span>
          <span class="status-value" id="statusWs">Disconnected</span>
        </div>
        <div class="status-item">
          <span class="status-label">Audio Context:</span>
          <span class="status-value" id="statusAudioCtx">Not initialized</span>
        </div>
        <div class="status-item">
          <span class="status-label">Microphone:</span>
          <span class="status-value" id="statusMic">Stopped</span>
        </div>
        <div class="status-item">
          <span class="status-label">Packets Sent/sec:</span>
          <span class="status-value" id="statusPacketsSent">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">Packets Recv/sec:</span>
          <span class="status-value" id="statusPacketsRecv">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">Jitter Buffer:</span>
          <span class="status-value" id="statusJitterBuffer">0 packets</span>
        </div>
      </div>
    </div>
    
    <div class="section">
      <h2>Logs</h2>
      <div class="log" id="logContainer"></div>
    </div>
  </div>
  
  <script src="client.js"></script>
</body>
</html>
