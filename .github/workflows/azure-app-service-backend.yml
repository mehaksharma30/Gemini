name: Deploy Backend to Azure App Service

# Backend deployment workflow for Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/azure-app-service-backend.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Build TypeScript
        working-directory: server
        run: npm run build

      - name: Enable WebSocket in Azure App Service
        run: |
          az webapp config set \
            --name mindmemos-api-2026 \
            --resource-group mindmemos-api-2026-group \
            --web-sockets-enabled true \
            --ids /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/mindmemos-api-2026-group/providers/Microsoft.Web/sites/mindmemos-api-2026 || echo "Note: WebSocket enablement may require manual configuration in Azure Portal"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'mindmemos-api-2026'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './server'

