name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "upload"
          app_location: "client"
          api_location: ""
          output_location: "dist/client/browser"